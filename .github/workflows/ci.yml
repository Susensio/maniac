name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

env:
  # Integration tests need pandoc >= 3.1.10 (ADR-0064); Ubuntu 24.04 ships 3.1.3.
  PANDOC_VERSION: "3.12.1"

jobs:
  matrix:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: extractions/setup-just@v4.0.0
      - name: Install pandoc, groff and man-db for the integration suite
        run: |
          curl -fsSL -o /tmp/pandoc.deb \
            "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
          sudo apt-get update -q
          sudo apt-get install -y -q /tmp/pandoc.deb groff-base man-db
          pandoc --version | head -1
          groff --version | head -1
      - run: uv sync --locked --all-groups
      - run: just check
