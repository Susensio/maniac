[project]
name = "maniac"
version = "0.1.0"
description = "Recursively scrape and extract CLI help manuals and subcommands"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "json-repair>=0.63.4",
    "litellm>=1.98.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "structlog>=24.0.0",
    "typer>=0.12.0",
    "zstandard>=0.23.0",
]

[project.scripts]
maniac = "maniac.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "complexipy>=8.0.1",
    "pytest>=8.0.0",
    "python-semantic-release>=10.0.0",
    "ruff>=0.5.0",
    "ty>=0.0.75",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
extend-select = ["B", "I", "UP", "RUF"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.complexipy]
max-complexity-allowed = 25

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
build_command = "uv lock --upgrade-package $PACKAGE_NAME && git add uv.lock"
allow_zero_version = true
major_on_zero = false
