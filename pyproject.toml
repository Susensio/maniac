[project]
name = "maniac"
version = "0.1.0"
description = "Recursively scrape and extract CLI help manuals and subcommands"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "loguru>=0.7.0",
    "typer>=0.12.0",
]

[project.scripts]
maniac = "maniac.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]

