[project]
name = "maniac"
version = "0.1.0"
description = "Recursively scrape and extract CLI help manuals and subcommands"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "json-repair>=0.63.4",
    "litellm>=1.98.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "structlog>=24.0.0",
    "typer>=0.12.0",
    "zstandard>=0.23.0",
]

[project.scripts]
maniac = "maniac.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "complexipy>=8.0.1",
    "import-linter>=2.15",
    "pytest>=8.0.0",
    "python-semantic-release>=10.0.0",
    "ruff>=0.5.0",
    "syrupy>=6.1.1",
    "ty>=0.0.75",
    "vulture>=2.16",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
extend-select = ["B", "I", "UP", "RUF"]

[tool.ruff.lint.pylint]
max-args = 10

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.complexipy]
max-complexity-allowed = 25

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: needs real pandoc, groff and man; run with `just integration` (ADR-0064)",
]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
build_command = "uv lock --upgrade-package $PACKAGE_NAME && git add uv.lock"
allow_zero_version = true
major_on_zero = false

# The architecture's import rules (`just audit`): layers import downward only,
# and no package or module imports its siblings in a cycle. Each top-level
# module belongs to exactly one layer (`exhaustive`); `|` separates siblings
# that must not import each other.
[tool.importlinter]
root_package = "maniac"

[[tool.importlinter.contracts]]
name = "Layers import downward only"
type = "layers"
containers = ["maniac"]
exhaustive = true
layers = [
    "__main__",
    "cli",
    "bench",
    "orchestration | listing | evaluation",
    "state | installer | generation | completion_files",
    "sources | lifecycle",
    "manifest | github_token",
    "config",
    "exceptions",
    "models | logging | templates",
]
broken_contract_guidance = "A lower layer imports a higher one: move the shared code down instead. Placing a new top-level module is a layer decision; the module docstring of `maniac/__init__.py` describes the layers."

[[tool.importlinter.contracts]]
name = "No import cycles"
type = "acyclic_siblings"
ancestors = ["maniac"]
# The CLI's command registration is the one accepted cycle.
skip_descendants = ["maniac.cli"]
broken_contract_guidance = "Modules that import each other cannot be understood, tested or moved apart."
