# Architecture audit (`just audit`, tools/audit.py).
#
# What answers each question, and what is worth a look. Import rules --
# layers and cycles -- live in pyproject.toml's `[tool.importlinter]`;
# `just audit` checks both.
#
# Each metric counts one kind of structural debt, and is one of two things:
#
# - a rule (the default): precise and cheap, a violation almost always a
#   mistake. `ceiling` is the most the code may have; above it the audit,
#   and so `just check` and CI, fails. `just audit --update` lowers a
#   ceiling once work brings a metric down; raising one is a decision, made
#   here in a commit that says why.
# - advice (`gate = false`): a heuristic whose findings need judgement. It
#   is shown with what it found, and never fails.
#
# `target` is where a metric should be; the 2026-10-10 architecture work
# took every one there. Paths are relative to the repository root; module
# names dotted.

[metric.resolution_implementations]
kind = "modules_calling"
why = "Which binary, who installed it and what version are answered in one place: call `resolution.locate`, `locate_file`, `locate_all` or `this_shell_runs` instead of their parts."
names = [
  "find_installation",
  "binary_path",
  "resolve_bin_path",
  "shim_target",
  "shim_target_here",
  "which_here",
  "_detect_via_registry",
]
allowed = ["maniac/sources/lookup/resolution.py", "maniac/sources/pathcache.py", "maniac/sources/providers/*"]
ceiling = 0
target = 0

[metric.resolution_exceptions_handled]
kind = "handlers_of"
why = "Resolution outcomes are values, not exceptions to catch: match on the result instead. Only the seams that turn them into values catch them (resolution for binaries, candidates for repositories)."
names = [
  "NotGloballySelected",
  "ShimRunsNothing",
  "MalformedToolMetadata",
  "OffLoginPath",
  "_DiscoveryError",
]
allowed = [
  "maniac/sources/lookup/resolution.py",
  "maniac/sources/lookup/candidates.py",
  "maniac/sources/discovery.py",
  "maniac/sources/providers/*",
]
ceiling = 0
target = 0

[metric.source_order_implementations]
kind = "modules_calling"
why = "The order shipped, upstream, generated is written once, in sources/lookup/candidates.py: walk `attempts`, or call `shipped_attempt` / `upstream_attempt`, instead of the selectors."
names = ["select_install_root", "select_repository"]
allowed = ["maniac/sources/lookup/candidates.py"]
ceiling = 0
target = 0

[metric.page_state_implementations]
kind = "modules_calling"
why = "A managed page's state must be computed in one place; call it instead of combining its ingredients."
names = ["managed_page_state", "provider_target_freshness", "link_state"]
allowed = ["maniac/manifest.py"]
ceiling = 1
target = 1

[metric.over_complex]
kind = "over_complex"
why = "Past the cognitive-complexity limit: split it if a reader would struggle, by the decisions it makes; some functions read best long."
limit = 25
gate = false
target = 0

[metric.dead_code]
kind = "dead_code"
why = "Possibly unused (vulture, a heuristic): delete it if nothing runs it; add a name to ignore_names if something does."
min_confidence = 60
ignore_decorators = ["@app.command", "@app.callback", "@dev.command"]
ignore_names = [
  "_clear_*",
  "*_reset",
  "clear_login_path",
  "transient",
]
gate = false
target = 0
